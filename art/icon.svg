<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="512" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2645"/>
      <stop offset="1" stop-color="#100f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="512" cy="512" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cfae"/>
      <stop offset="1" stop-color="#d38c62"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e8ef"/>
      <stop offset="1" stop-color="#8691a0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="160" fill="url(#glow)"/>

  <!-- Human hand: arm from the top right, index finger reaching left -->
  <g transform="translate(556 498) rotate(-16)">
    <g fill="url(#skin)">
      <rect x="380" y="2" width="620" height="96" rx="48"/>
      <rect x="205" y="-24" width="200" height="140" rx="58"/>
      <rect x="240" y="-46" width="120" height="34" rx="17"/>
      <rect x="168" y="28" width="96" height="30" rx="15"/>
      <rect x="176" y="60" width="90" height="30" rx="15"/>
      <rect x="190" y="92" width="76" height="28" rx="14"/>
      <rect x="0" y="-21" width="250" height="42" rx="21"/>
    </g>
    <ellipse cx="26" cy="-9" rx="16" ry="6" fill="#ffe9d8" opacity="0.8"/>
    <path d="M95 -17 q-6 17 0 34 M170 -17 q-6 17 0 34" stroke="#b46f4c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Machine hand: same shape mirrored, arm from the bottom left -->
  <g transform="translate(468 526) scale(-1 1) rotate(16)">
    <g fill="url(#steel)">
      <rect x="380" y="2" width="620" height="96" rx="48"/>
      <rect x="205" y="-24" width="200" height="140" rx="58"/>
      <rect x="240" y="-46" width="120" height="34" rx="17"/>
      <rect x="168" y="28" width="96" height="30" rx="15"/>
      <rect x="176" y="60" width="90" height="30" rx="15"/>
      <rect x="190" y="92" width="76" height="28" rx="14"/>
      <rect x="0" y="-21" width="250" height="42" rx="21"/>
    </g>
    <g fill="#4a5361">
      <circle cx="92" cy="0" r="9"/>
      <circle cx="170" cy="0" r="9"/>
      <circle cx="300" cy="46" r="14"/>
      <rect x="470" y="30" width="460" height="8" rx="4"/>
      <rect x="470" y="62" width="460" height="8" rx="4"/>
    </g>
    <circle cx="14" cy="0" r="7" fill="#7fe3ff"/>
  </g>

  <circle cx="512" cy="512" r="13" fill="#fffaf0"/>
</svg>
